services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foxtheta
      POSTGRES_PASSWORD: foxtheta
      POSTGRES_DB: foxtheta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxtheta"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../apps/backend
    env_file:
      - ../../apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://foxtheta:foxtheta@postgres:5432/foxtheta
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
