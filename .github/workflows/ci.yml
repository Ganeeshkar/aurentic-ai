name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run test suite
        # Tests run against an in-memory SQLite DB — see tests/conftest.py,
        # which sets its own JWT_SECRET_KEY/DATABASE_URL defaults, so no
        # secrets are needed here.
        run: poetry run pytest -v

  backend-migration-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurentic
          POSTGRES_PASSWORD: aurentic
          POSTGRES_DB: aurentic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurentic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+asyncpg://aurentic:aurentic@localhost:5432/aurentic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Migrate up against real Postgres
        # This step exists because the migration uses Postgres-native
        # ENUM/JSONB types that the SQLite-backed unit tests never
        # exercise — a migration bug here would otherwise only surface
        # the first time someone deploys.
        run: poetry run alembic upgrade head

      - name: Migrate down (rollback safety check)
        run: poetry run alembic downgrade base

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
