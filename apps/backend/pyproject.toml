[tool.poetry]
name = "foxtheta-backend"
version = "0.1.0"
description = "Foxtheta — backend API (auth, lead capture, admin)"
authors = ["Foxtheta"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
greenlet = "^3.1.1"
asyncpg = "^0.31.0"
alembic = "^1.13.2"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
pyjwt = "^2.9.0"
passlib = {extras = ["argon2"], version = "^1.7.4"}
python-multipart = "^0.0.9"
email-validator = "^2.2.0"
slowapi = "^0.1.9"
aiosmtplib = "^3.0.2"
httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
